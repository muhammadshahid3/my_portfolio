apiVersion: apps/v1
kind: Deployment

metadata:
  name: static-web-app
  namespace: static-web-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: static-web-app

  template:
    metadata:
      labels:
        app: static-web-app

    spec:
      containers:
        - name: static-web-app
          image: shahiddevops1/my-portfolio-app
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 200m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20