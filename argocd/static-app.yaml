
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: static-web-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/muhammadshahid3/my_portfolio.git
    targetRevision: main
    path: k8s

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: static-web-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
