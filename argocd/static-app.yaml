apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: static-web-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/muhammadshahid3/my_portfolio.git
    targetRevision: main
    path: helm/static-app

  destination:
    server: https://kubernetes.default.svc
    namespace: static-web-apps

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true